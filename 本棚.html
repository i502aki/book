<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>本棚検索</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;700&family=Shippori+Mincho:wght@400;700&display=swap');

  :root {
    --bg: #f4f1eb;
    --surface: #ede9e0;
    --card: #ffffff;
    --border: #d6cfc2;
    --accent: #8b6914;
    --accent2: #2e7fa0;
    --text: #2c2416;
    --text-muted: #7a6e5e;
    --text-dim: #b0a492;
    --star: #b07d10;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Serif JP', serif;
    min-height: 100vh;
    background-image:
      radial-gradient(ellipse at 20% 0%, rgba(139,105,20,0.06) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 100%, rgba(46,127,160,0.05) 0%, transparent 50%);
  }

  header {
    padding: 2rem 2rem 1.2rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    gap: 1.5rem;
    flex-wrap: wrap;
  }
  header h1 {
    font-family: 'Shippori Mincho', serif;
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.15em;
  }
  header .subtitle {
    font-size: 0.72rem;
    color: var(--text-muted);
    letter-spacing: 0.12em;
  }
  header .nav-link {
    margin-left: auto;
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.4rem 1rem;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--text-muted);
    font-family: 'Noto Serif JP', serif;
    font-size: 0.78rem;
    letter-spacing: 0.06em;
    text-decoration: none;
    transition: border-color 0.15s, color 0.15s, box-shadow 0.15s;
  }
  header .nav-link:hover {
    border-color: var(--accent2);
    color: var(--accent2);
    box-shadow: 0 2px 8px rgba(46,127,160,0.1);
  }

  .search-area {
    padding: 1.2rem 2rem;
    display: flex;
    gap: 1rem;
    align-items: center;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .search-wrap {
    position: relative;
    flex: 1;
    min-width: 200px;
    max-width: 460px;
  }
  .search-wrap svg {
    position: absolute;
    left: 1rem;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    pointer-events: none;
  }
  #searchInput {
    width: 100%;
    padding: 0.65rem 1rem 0.65rem 2.8rem;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'Noto Serif JP', serif;
    font-size: 0.95rem;
    transition: border-color 0.2s, box-shadow 0.2s;
    outline: none;
  }
  #searchInput:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(200,169,110,0.12);
  }
  #searchInput::placeholder { color: var(--text-dim); }

  .filter-group {
    display: flex;
    gap: 0.4rem;
    align-items: center;
    flex-wrap: wrap;
  }
  .filter-label { font-size: 0.72rem; color: var(--text-muted); letter-spacing: 0.05em; }
  .filter-btn {
    padding: 0.4rem 0.8rem;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-muted);
    font-family: 'Noto Serif JP', serif;
    font-size: 0.78rem;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.04em;
  }
  .filter-btn:hover { border-color: var(--accent2); color: var(--accent2); }
  .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #ffffff; font-weight: 700; }

  .count-bar {
    padding: 0.65rem 2rem;
    font-size: 0.78rem;
    color: var(--text-muted);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }
  .count-bar strong { color: var(--accent); font-size: 0.95rem; }

  /* ctrl bar */
  .ctrl-bar {
    padding: 0.6rem 2rem;
    display: flex;
    gap: 0.6rem;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
  }
  .ctrl-btn {
    padding: 0.3rem 0.8rem;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 5px;
    color: var(--text-muted);
    font-family: 'Noto Serif JP', serif;
    font-size: 0.72rem;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.05em;
  }
  .ctrl-btn:hover { border-color: var(--accent2); color: var(--accent2); }

  /* 年セクション */
  .year-section { border-bottom: 1px solid var(--border); }

  .year-header {
    display: flex;
    align-items: center;
    gap: 0.9rem;
    padding: 0.85rem 2rem;
    cursor: pointer;
    user-select: none;
    transition: background 0.15s;
    background: var(--surface);
    flex-wrap: wrap;
  }
  .year-header:hover { background: #e5e0d5; }

  .year-chevron {
    width: 17px;
    height: 17px;
    color: var(--text-dim);
    transition: transform 0.25s ease;
    flex-shrink: 0;
  }
  .year-section.open .year-chevron {
    transform: rotate(90deg);
    color: var(--accent);
  }

  .year-label {
    font-family: 'Shippori Mincho', serif;
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.1em;
    min-width: 72px;
  }

  .year-count {
    font-size: 0.7rem;
    color: var(--text-muted);
    padding: 0.12rem 0.55rem;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    white-space: nowrap;
  }

  /* 統計バッジ群 */
  .year-stats {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
    margin-left: auto;
  }

  .stat-badge {
    display: flex;
    align-items: center;
    gap: 0.3rem;
    padding: 0.15rem 0.6rem;
    border-radius: 20px;
    font-size: 0.68rem;
    letter-spacing: 0.03em;
    white-space: nowrap;
    border: 1px solid transparent;
  }

  .stat-badge .stat-icon { font-size: 0.72rem; }
  .stat-badge .stat-val { font-weight: 700; font-size: 0.72rem; }
  .stat-badge .stat-unit { opacity: 0.75; font-size: 0.65rem; }

  /* ゼロの場合は薄く */
  .stat-badge.zero { opacity: 0.3; }

  .year-body { display: none; padding: 1.2rem 2rem 1.5rem; }
  .year-section.open .year-body { display: block; }

  /* 検索時 */
  body.searching .year-header { display: none; }
  body.searching .year-body { display: block; padding-top: 0; padding-bottom: 0; }
  body.searching .year-section { border-bottom: none; }

  .book-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 1rem;
  }

  #searchResultGrid {
    display: none;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 1rem;
    padding: 1.2rem 2rem 3rem;
  }

  .book-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    display: flex;
    flex-direction: column;
  }
  .book-card:hover {
    transform: translateY(-3px);
    border-color: var(--accent);
    box-shadow: 0 8px 24px rgba(200,169,110,0.15);
  }
  .book-img-wrap {
    width: 100%;
    aspect-ratio: 3/4;
    background: var(--surface);
    overflow: hidden;
  }
  .book-img-wrap img { width: 100%; height: 100%; object-fit: cover; }
  .book-img-wrap .no-img {
    width: 100%; height: 100%;
    display: none; align-items: center; justify-content: center;
    font-size: 2rem; color: var(--text-dim);
    background: linear-gradient(135deg, var(--bg), var(--surface));
  }
  .book-info { padding: 0.55rem 0.65rem 0.65rem; flex: 1; display: flex; flex-direction: column; gap: 0.25rem; }
  .book-date { font-size: 0.62rem; color: var(--text-dim); letter-spacing: 0.04em; }
  .book-title {
    font-size: 0.78rem; line-height: 1.45; color: var(--text);
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .book-rating { font-size: 0.72rem; color: var(--star); margin-top: auto; }
  .book-rating.sankaku { color: #78b4c8; }

  mark { background: rgba(200,169,110,0.28); color: var(--accent); border-radius: 2px; padding: 0 1px; }

  /* ===== 回収カードのスタイル ===== */
  /* 回収済みカードのオーバーレイ設定 */
  :root {
    --recovered-overlay-color: rgba(120, 120, 120, 0.55); /* グレーの濃さ (0〜1) */
    --recovered-badge-bg: rgba(80, 80, 80, 0.85);
    --recovered-badge-text: #ffffff;
  }

  .book-card.recovered {
    position: relative;
  }
  .book-card.recovered::after {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--recovered-overlay-color);
    border-radius: 10px;
    pointer-events: none;
    z-index: 1;
  }
  .book-card.recovered .recovered-badge {
    position: absolute;
    top: 6px;
    right: 6px;
    background: var(--recovered-badge-bg);
    color: var(--recovered-badge-text);
    font-size: 0.6rem;
    font-family: 'Noto Serif JP', serif;
    padding: 0.15rem 0.45rem;
    border-radius: 20px;
    z-index: 2;
    letter-spacing: 0.03em;
    white-space: nowrap;
  }
  /* ============================= */

  #noResults {
    display: none; text-align: center; padding: 4rem 2rem;
    color: var(--text-muted); font-size: 0.95rem; letter-spacing: 0.1em;
  }

  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }

  @media (max-width: 600px) {
    header { padding: 1.2rem 1rem 0.8rem; }
    .search-area { padding: 0.8rem 1rem; }
    .year-header { padding: 0.8rem 1rem; gap: 0.6rem; }
    .year-stats { margin-left: 0; width: 100%; }
    .year-body { padding: 0.8rem 1rem 1rem; }
    .book-grid, #searchResultGrid { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 0.7rem; }
    #searchResultGrid { padding: 0.8rem 1rem 2rem; }
    .count-bar, .ctrl-bar { padding: 0.5rem 1rem; }
  }
</style>
</head>

function getYear(yymm) {
  if (!yymm || yymm.length < 2) return '不明';
  const yy = parseInt(yymm.slice(0,2));
  return yy >= 50 ? String(1900+yy) : String(2000+yy);
}

function fmtDate(yymm) {
  if (!yymm || yymm.length < 4) return '';
  const yy = parseInt(yymm.slice(0,2));
  const mm = parseInt(yymm.slice(2,4));
  const year = yy >= 50 ? 1900+yy : 2000+yy;
  return year + '年' + mm + '月';
}

function ratingLevel(r) {
  if (r === '★★★') return 3;
  if (r === '★★') return 2;
  if (r === '★') return 1;
  if (r === '△') return -1;
  return 0;
}

function highlight(text, q) {
  if (!q) return text;
  const esc = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return text.replace(new RegExp(esc, 'gi'), m => '<mark>' + m + '</mark>');
}

function fmtHours(h) {
  if (!h) return null;
  const hh = Math.floor(h);
  const mm = Math.round((h - hh) * 60);
  if (hh === 0) return mm + '分';
  return mm > 0 ? hh + '時間' + mm + '分' : hh + '時間';
}

function fmtMoney(n) {
  if (!n) return null;
  return '¥' + Math.round(n).toLocaleString();
}

  const [yymm, title, rating, href, img] = book;
  const displayTitle = query ? highlight(title, query) : title;
  const dateStr = fmtDate(yymm);
  const rClass = rating === '△' ? 'book-rating sankaku' : 'book-rating';

  const isRecovered = recoveredAmt !== undefined;
  const recoveredClass = isRecovered ? ' recovered' : '';
  const recoveredBadge = isRecovered
    ? `<div class="recovered-badge">回収 ¥${recoveredAmt.toLocaleString()}</div>`
    : '';

  return `<div class="book-card${recoveredClass}" onclick="window.open('${safeHref}','_blank')">

  <div class="book-img-wrap">

  document.querySelectorAll('.year-section').forEach(s => s.classList.add('open'));
});
document.getElementById('collapseAll').addEventListener('click', () => {
  document.querySelectorAll('.year-section').forEach(s => s.classList.remove('open'));
});

let currentQuery = '';
let currentRating = 'all';

function applyFilter() {
  const q = currentQuery.trim().toLowerCase();
  const rating = currentRating;
  const isSearching = q || rating !== 'all';

  const countBar = document.getElementById('countBar');
  const ctrlBar = document.getElementById('ctrlBar');
  const searchGrid = document.getElementById('searchResultGrid');
  const noResults = document.getElementById('noResults');

  if (isSearching) {
    document.body.classList.add('searching');
    ctrlBar.style.display = 'none';
    countBar.style.display = 'flex';
    searchGrid.style.display = 'grid';
    sectionsEl.style.display = 'none';

    const matched = BOOKS.filter(([yymm, title, r]) => {
      if (q && !title.toLowerCase().includes(q)) return false;
      if (rating === '★★★' && ratingLevel(r) < 3) return false;
      if (rating === '★★' && ratingLevel(r) < 2) return false;
      if (rating === '★' && ratingLevel(r) < 1) return false;
      if (rating === '△' && r !== '△') return false;
      return true;
    });

    searchGrid.innerHTML = matched.map(b => cardHTML(b, currentQuery.trim())).join('');
    document.getElementById('countNum').textContent = matched.length;
    noResults.style.display = matched.length === 0 ? 'block' : 'none';
  } else {
    document.body.classList.remove('searching');
    ctrlBar.style.display = 'flex';
    countBar.style.display = 'none';
    searchGrid.style.display = 'none';
    sectionsEl.style.display = 'block';
    noResults.style.display = 'none';
  }
}

document.getElementById('searchInput').addEventListener('input', e => {
  currentQuery = e.target.value;
  applyFilter();
});

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentRating = btn.dataset.rating;
    applyFilter();
  });
});
</script>
